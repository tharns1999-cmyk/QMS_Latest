name: Nightly backup

# Off until the repository variable BACKUP_ENABLED is "true" (set it after adding the secrets in docs/ops/backup-restore.md).
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 in Thailand
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      # rclone reads these as remote definitions. gdrive = the company Google Drive folder, r2 = the PDF bucket,
      # safe = gdrive with client-side encryption (file names stay readable so people can find a date).
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_SAFE_TYPE: crypt
      RCLONE_CONFIG_SAFE_REMOTE: 'gdrive:'
      RCLONE_CONFIG_SAFE_FILENAME_ENCRYPTION: 'off'
      RCLONE_CONFIG_SAFE_DIRECTORY_NAME_ENCRYPTION: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Check configuration
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then echo "wrangler.jsonc still has the placeholder database_id"; exit 1; fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_PASSWORD RCLONE_CONFIG_GDRIVE_TOKEN RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "Missing secret for $name"; exit 1; fi
          done
          obscured=$(rclone obscure "$BACKUP_PASSWORD")
          echo "::add-mask::$obscured"
          echo "RCLONE_CONFIG_SAFE_PASSWORD=$obscured" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Export the database and prove the export restores
        run: |
          node scripts/backup-tools.js counts --remote > counts-before.json
          npx wrangler d1 export DB --remote --skip-confirmation --output qms.sql
          node scripts/backup-tools.js counts --remote > counts-after.json
          node scripts/backup-tools.js verify qms.sql --min counts-before.json --max counts-after.json
          sha256sum qms.sql | tee qms.sql.sha256
          cp counts-after.json counts.json

      - name: Upload the database backup and read it back
        run: |
          rclone copy qms.sql "safe:daily/$DATE"
          rclone copy qms.sql.sha256 "safe:daily/$DATE"
          rclone copy counts.json "safe:daily/$DATE"
          [ "$(rclone cat "safe:daily/$DATE/qms.sql" | sha256sum | cut -d' ' -f1)" = "$(cut -d' ' -f1 qms.sql.sha256)" ]

      - name: Copy the controlled PDFs (never deletes)
        run: |
          rclone mkdir safe:files # an empty bucket would otherwise leave nothing to measure
          rclone copy r2:qms-files safe:files --transfers 8
          source_count=$(rclone size r2:qms-files --json | jq .count)
          backup_count=$(rclone size safe:files --json | jq .count)
          echo "PDFs in R2: $source_count, in backup: $backup_count"
          [ "$backup_count" -ge "$source_count" ]

      - name: Keep the first backup of each month, drop dailies older than 35 days
        run: |
          if [ "$(date -u +%d)" = "01" ]; then rclone copy "safe:daily/$DATE" "safe:monthly/$DATE"; fi
          rclone delete safe:daily --min-age 35d --rmdirs
