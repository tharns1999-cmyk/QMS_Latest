version: 2
# Minor and patch updates arrive as one grouped PR per area; major versions stay separate so they get a proper look.
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      api-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      web-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      actions: { update-types: [minor, patch] }
